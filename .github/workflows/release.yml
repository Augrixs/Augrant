name: Release AAB (Play Store)

# Run by hand: Actions -> Release AAB -> Run workflow.
# Needs the repository secret KEYSTORE_PASSWORD. The first run creates the upload key (native/upload.jks, locked with that password).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the password secret
        run: |
          if [ -z "$KS_PASS" ] || [ ${#KS_PASS} -lt 12 ]; then echo "Add a repository secret KEYSTORE_PASSWORD (12+ characters)"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the upload key once
        run: |
          if [ ! -f native/upload.jks ]; then
            keytool -genkeypair -keystore native/upload.jks -alias augrant -keyalg RSA -keysize 2048 -validity 10000 -storepass:env KS_PASS -keypass:env KS_PASS -dname "CN=Augrant"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add native/upload.jks
            git commit -m "Add upload key (locked with KEYSTORE_PASSWORD) [skip ci]"
            git push origin HEAD:main
          fi

      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx cap add android

      - name: Plugin, icons, permissions
        run: python3 scripts/patch_android.py
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Target Android 16 (API 36) and release signing
        run: |
          sed -i -E 's/(compileSdkVersion *= *)[0-9]+/\136/; s/(targetSdkVersion *= *)[0-9]+/\136/' android/variables.gradle
          sed -i -E "s#(com.android.tools.build:gradle:)[0-9.]+#\18.9.1#" android/build.gradle
          sed -i -E 's#gradle-[0-9.]+-(all|bin).zip#gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = s.replace("    signingConfigs {\n", "    signingConfigs {\n        release {\n            storeFile file('../../native/upload.jks')\n            storePassword System.getenv('KS_PASS')\n            keyAlias 'augrant'\n            keyPassword System.getenv('KS_PASS')\n        }\n", 1)
          s, n = re.subn(r'(buildTypes\s*\{\s*release\s*\{\s*\n)', r"\1            signingConfig signingConfigs.release\n", s, count=1)
          if n != 1: raise SystemExit('release block not found')
          open(p, 'w').write(s)
          PY
          cat android/variables.gradle

      - run: npx cap sync android

      - name: Build the AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Augrant-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
